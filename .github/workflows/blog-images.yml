name: Blog images

on:
  push:
    branches: [main]
    paths: ['blog/images/incoming.json']
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: daily-blog-publish
  cancel-in-progress: false

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install Pillow
      - name: Download images and rebuild the blog
        run: python scripts/fetch_images.py
      - name: Commit and push
        run: |
          git config user.name "PAFP Blog Bot"
          git config user.email "actions@github.com"
          git add -A blog/ sitemap.xml
          git diff --staged --quiet || git commit -m "Blog: new hero images"
          for i in 1 2 3; do git pull --rebase -q && git push && break; sleep 5; done
